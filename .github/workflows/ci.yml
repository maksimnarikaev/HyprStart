name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '8.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore HyprStart.sln

      - name: Build
        run: dotnet build HyprStart.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test tests\HyprStart.Core.Tests -c Release --no-build --logger "console;verbosity=normal"

  release:
    name: Publish portable release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-test
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish self-contained single-file
        run: >
          dotnet publish src\HyprStart.App\HyprStart.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=none
          -o dist\win-x64

      - name: Package zip
        shell: pwsh
        run: |
          $out = 'dist/HyprStart-win-x64.zip'
          if (Test-Path $out) { Remove-Item $out -Force }
          Compress-Archive -Path 'dist/win-x64/*' -DestinationPath $out -CompressionLevel Optimal
          $size = (Get-Item $out).Length
          Write-Host "Created $out ($size bytes)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyprStart-win-x64
          path: dist/HyprStart-win-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/HyprStart-win-x64.zip
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
